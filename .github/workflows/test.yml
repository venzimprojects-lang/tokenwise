name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check website/app.js
      - run: python3 -m unittest discover -s tests -v
